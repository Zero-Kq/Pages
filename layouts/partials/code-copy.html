<script>
(() => {
    const blocks = [];
    let fallbackCopying = false;
    async function copyText(text) {
        if (window.isSecureContext && navigator.clipboard) {
            try { await navigator.clipboard.writeText(text); return; }
            catch (_) { /* Try the fallback for denied clipboard access. */ }
        }
        const selection = window.getSelection();
        const ranges = Array.from({ length: selection.rangeCount }, (_, i) => selection.getRangeAt(i).cloneRange());
        const focused = document.activeElement;
        const input = document.createElement('textarea');
        input.value = text;
        input.readOnly = true;
        input.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
        document.body.appendChild(input);
        try {
            input.focus({ preventScroll: true });
            input.select();
            fallbackCopying = true;
            if (!document.execCommand('copy')) throw new Error('Copy failed');
        } finally {
            fallbackCopying = false;
            input.remove();
            if (focused && focused.focus) focused.focus({ preventScroll: true });
            selection.removeAllRanges();
            ranges.forEach(range => selection.addRange(range));
        }
    }
    document.querySelectorAll('.post-content pre > code').forEach(code => {
        // Hugo places line numbers in a separate code element in the first cell.
        if (code.closest('.lntd') && !code.hasAttribute('data-lang')) return;
        let container = code.closest('.highlight');
        if (!container) {
            container = document.createElement('div');
            code.parentElement.before(container);
            container.appendChild(code.parentElement);
        }
        container.classList.add('code-copy-block');
        container.querySelectorAll('.lntd:first-child').forEach(gutter => gutter.setAttribute('aria-hidden', 'true'));
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'code-copy-button';
        button.textContent = '复制';
        button.title = '复制全部代码';
        button.setAttribute('aria-label', '复制全部代码');
        button.setAttribute('aria-live', 'polite');
        let resetTimer;
        button.addEventListener('click', async () => {
            clearTimeout(resetTimer);
            button.disabled = true;
            try {
                await copyText(code.textContent);
                button.textContent = '已复制';
                button.setAttribute('aria-label', '代码已复制');
            } catch (_) {
                button.textContent = '复制失败';
                button.setAttribute('aria-label', '复制失败，请选中代码手动复制');
            } finally {
                button.disabled = false;
                resetTimer = setTimeout(() => {
                    button.textContent = '复制';
                    button.setAttribute('aria-label', '复制全部代码');
                }, 2000);
            }
        });
        container.appendChild(button);
        blocks.push({ container, code });
    });
    document.addEventListener('copy', event => {
        if (fallbackCopying || !event.clipboardData) return;
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount !== 1) return;
        const range = selection.getRangeAt(0);
        const block = blocks.find(({ container }) => container.contains(range.commonAncestorContainer));
        if (!block || !range.intersectsNode(block.code)) return;
        // Copy source whitespace, excluding the gutter and button, even for partial selections.
        const codeRange = document.createRange();
        codeRange.selectNodeContents(block.code);
        const selected = range.cloneRange();
        if (selected.compareBoundaryPoints(Range.START_TO_START, codeRange) < 0) {
            selected.setStart(codeRange.startContainer, codeRange.startOffset);
        }
        if (selected.compareBoundaryPoints(Range.END_TO_END, codeRange) > 0) {
            selected.setEnd(codeRange.endContainer, codeRange.endOffset);
        }
        event.clipboardData.setData('text/plain', selected.cloneContents().textContent);
        event.preventDefault();
    });
})();
</script>
